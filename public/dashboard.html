<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body{
      font-family:sans-serif;
      padding:20px;
      background:#f5f5f5;
    }
    h2{
      text-align:center;
    }
    table{
      width:100%;
      border-collapse:collapse;
      background:#fff;
    }
    th,td{
      border:1px solid #ddd;
      padding:12px;
      text-align:center;
    }
    th{
      background:#2e7d32;
      color:#fff;
    }
    button{
      padding:8px 12px;
      margin:2px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      color:#fff;
    }
    .accept{
      background:green;
    }
    .reject{
      background:red;
    }
    .pending{
      color:orange;
      font-weight:bold;
    }
    .accepted{
      color:green;
      font-weight:bold;
    }
    .rejected{
      color:red;
      font-weight:bold;
    }
  </style>
</head>
<body>

<h2>Appointments Dashboard</h2>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Date</th>
      <th>Time</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="data"></tbody>
</table>

<script>
function loadData() {
  fetch("/data")
    .then(res => res.json())
    .then(data => {
      const tbody = document.getElementById("data");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6'>No Appointments</td></tr>";
        return;
      }

      data.forEach(d => {
        const row = document.createElement("tr");

        let statusClass = "pending";
        if (d.status === "Accepted") statusClass = "accepted";
        if (d.status === "Rejected") statusClass = "rejected";

        row.innerHTML = `
          <td>${d.name}</td>
          <td>${d.phone}</td>
          <td>${d.date}</td>
          <td>${d.time}</td>
          <td class="${statusClass}">${d.status || "Pending"}</td>
          <td>
            <button class="accept" onclick="updateStatus('${d.phone}','${d.date}','${d.time}','Accepted')">Accept</button>
            <button class="reject" onclick="updateStatus('${d.phone}','${d.date}','${d.time}','Rejected')">Reject</button>
          </td>
        `;

        tbody.appendChild(row);
      });
    });
}

function updateStatus(phone, date, time, status) {
  fetch("/update-status", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ phone, date, time, status })
  })
  .then(res => res.json())
  .then(result => {
    if (result.ok) {
      loadData();
    } else {
      alert("Status update failed");
    }
  })
  .catch(() => {
    alert("Server error");
  });
}

loadData();
</script>

</body>
</html>
