<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <style>
    body{
      font-family:sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f5f5f5;
    }
    .box{
      padding:30px;
      background:#fff;
      border-radius:10px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }
    input{
      display:block;
      width:250px;
      margin:10px 0;
      padding:10px;
    }
    button{
      padding:10px;
      width:100%;
      background:#2e7d32;
      color:#fff;
      border:none;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Doctor Login</h2>

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<script>
function login(){
  fetch("/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      username: document.getElementById("user").value,
      password: document.getElementById("pass").value
    })
  })
  .then(res=>res.json())
  .then(d=>{
    if(d.ok){
      window.location="/dashboard";
    } else {
      alert("Wrong login");
    }
  });
}
</script>

</body>
</html>
